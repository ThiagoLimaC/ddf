[project]
name = "ddf"
version = "0.1.0"
description = "Data Dictionary Framework"
readme = "README.md"
authors = [
    { name = "ThiagoLimaC", email = "thiagolima120603@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "jinja2>=3.1.6",
    "polars>=1.42.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
]

[project.scripts]
ddf = "ddf:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "testcontainers[postgres]>=4.14.2",
    "types-psycopg2>=2.9.21.20260518",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src"]

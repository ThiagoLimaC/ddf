[project]
name = "ddf"
version = "0.1.0"
description = "Data Dictionary Framework"
readme = "README.md"
authors = [
    { name = "ThiagoLimaC", email = "thiagolima120603@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "connectorx>=0.4.5",
    "dbutils>=3.1.1",
    "jinja2>=3.1.6",
    "polars>=1.42.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pymysql>=1.1.2",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
]

[project.scripts]
ddf = "ddf:main"

[project.entry-points."ddf.extratores"]
PostgreSQL = "ddf.infrastructure.adapters.cli.registro.extratores:_REGISTRO_POSTGRES"
MariaDB = "ddf.infrastructure.adapters.cli.registro.extratores:_REGISTRO_MARIADB"

[project.entry-points."ddf.geradores"]
Markdown = "ddf.infrastructure.adapters.generators.markdown.gerador_markdown:GeradorMarkdown"
Dbt = "ddf.infrastructure.adapters.generators.dbt.gerador_dbt:GeradorDbt"
ContextoDeIA = "ddf.infrastructure.adapters.generators.contexto_de_ia.gerador_contexto_de_ia:GeradorContextoDeIA"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "testcontainers[mysql,postgres]>=4.14.2",
    "types-psycopg2>=2.9.21.20260518",
    "types-pymysql>=1.1.0.20250516",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]

[tool.ruff.lint.per-file-ignores]
"src/ddf/infrastructure/adapters/cli/wizard.py" = ["E501", "W293"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "dbutils.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not benchmark'"
markers = [
    "benchmark: oneroso (cria centenas de tabelas via testcontainers); rode explicitamente com -m benchmark",
]
